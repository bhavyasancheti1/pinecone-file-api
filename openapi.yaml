openapi: 3.1.0
info:
  title: File Upload to Pinecone
  version: 1.0.0
paths:
  /upload-file/:
    post:
      summary: Upload CSV or PDF to Pinecone
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful upload
